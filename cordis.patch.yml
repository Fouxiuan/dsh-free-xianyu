# dsh-free-xianyu — bundle patch.
#
# Mounts the Host half (managed backend lifecycle, the /api/dsh-free-xianyu
# routes, the goofish_* agent tools) plus the browser half declared by
# package.json's `dsh.client` (the sidebar panel).
- insert:
    - id: dsh-free-xianyu
      name: 'dsh-free-xianyu'
      config:
        projectRoot: ''
        # '' = auto-detect a Python 3.10+ interpreter (python3 / py -3 / Homebrew / /usr/local).
        # Pinning a binary here means every failure names that binary instead of falling back.
        pythonPath: ''
        serverPort: 8848
        autoStart: true
        buildFrontend: true
        autoBuildFrontend: true
        frontendInstall: true
